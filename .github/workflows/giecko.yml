name:  Giecko Terminal

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Session: "ide" = terminal + VS Code, "terminal" = shell only, "vscode" = VS Code only, "desktop" = full GUI OS in the browser'
        required: false
        default: 'ide'
        type: choice
        options: [ide, terminal, vscode, desktop]
      os:
        description: 'Runner OS (docker distros are only available on ubuntu)'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
      distro:
        description: 'Shell environment: runner OS directly, or a docker distro (linux only)'
        required: false
        default: 'runner'
        type: choice
        options: [runner, ubuntu, debian, fedora, arch, alpine]
      user:
        description: 'Terminal username (letters, numbers, _ and -)'
        required: false
        default: 'giecko'
      password:
        description: 'Login password (blank = NO auth, anyone with the link gets in)'
        required: false
        default: 'giecko'
      mask:
        description: 'Streamer mode: hide the tunnel hostname in logs/summary (QR in logs still works)'
        required: false
        default: false
        type: boolean
      duration_minutes:
        description: 'How long to keep alive (max 360 = 6h, GitHub limit)'
        required: false
        default: '180'
      packages:
        description: 'Extra system packages to install (space-separated)'
        required: false
        default: ''
      autosave_minutes:
        description: 'Snapshot the session work branch every N min (0 = off)'
        required: false
        default: '15'
      cf_token:
        description: 'Optional: Cloudflare named-tunnel token (blank = random trycloudflare.com URL)'
        required: false
        default: ''
      restore:
        description: 'Optional: run id whose saved files to copy into the new workspace at boot'
        required: false
        default: ''
      plugins:
        description: 'Optional: npm packages to install into the session (space-separated, each tagged gcko.pkg-<name>)'
        required: false
        default: ''
  push:
    branches: [arena/01a09a7b-giecko]

permissions:
  contents: write

run-name:  Giecko session

jobs:
  terminal:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip giecko]')
    runs-on: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[os=macos]') && 'macos-latest' || contains(github.event.head_commit.message, '[os=windows]') && 'windows-latest' || 'ubuntu-latest') || inputs.os }}
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CF_TUNNEL_TOKEN: ${{ inputs.cf_token }}
      GIECKO_RESTORE: ${{ inputs.restore }}
      GIECKO_PLUGINS: ${{ inputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Annotation probe
        shell: bash
        run: echo "::notice::probe-yaml-hello"

      - name: Start Giecko virtual environment
        shell: bash
        run: |
          chmod +x scripts/giecko.sh scripts/giecko
          ./scripts/giecko.sh \
            "${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[noauth]') && '__BLANK__' || 'test-giecko-123') || inputs.password }}" \
            "${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[quick]') && '0' || '10') || inputs.duration_minutes }}" \
            "${{ inputs.packages }}" \
            "${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[stack=vscode]') && 'vscode' || contains(github.event.head_commit.message, '[stack=terminal]') && 'terminal' || contains(github.event.head_commit.message, '[stack=desktop]') && 'desktop' || 'ide') || inputs.stack }}" \
            "${{ github.event_name == 'push' && '0' || inputs.autosave_minutes }}" \
            "${{ github.event_name == 'push' && 'giecko' || inputs.user }}" \
            "${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[mask]') || inputs.mask }}" \
            "${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[distro=alpine]') && 'alpine' || contains(github.event.head_commit.message, '[distro=arch]') && 'arch' || contains(github.event.head_commit.message, '[distro=fedora]') && 'fedora' || contains(github.event.head_commit.message, '[distro=ubuntu]') && 'ubuntu' || contains(github.event.head_commit.message, '[distro=debian]') && 'debian' || 'runner') || inputs.distro }}"
