[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localprompt"
version = "0.2.0"
description = "Local AI assistant with agents, swarm mode, memory, providers, MCP, web search & more"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "llama-cpp-python>=0.3.0",
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "httpx>=0.24",
    "numpy>=1.20",
    "diskcache>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
cuda = [
    "llama-cpp-python[cuda]>=0.3.0",
]

[project.scripts]
localprompt = "localprompt.cli:main"

[tool.setuptools.packages.find]
include = ["localprompt*"]
